name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda/src/**'
      - 'lambda/requirements*.txt'
      - 'lambda/Dockerfile*'
      - '!.github/**'
      - '!**/*.md'
      - '!**/test*.py'
      - '!**/__pycache__/**'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required for checkout

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          echo "=== GitHub OIDC Environment ==="
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:0:20}..."
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          
          # Request token with audience = repo URL
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/pavukanez/pavukanez-backend" | jq -r .value)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to get token"
            exit 1
          fi
          
          echo "Token obtained (length: ${#TOKEN})"
          echo "Token header:"
          echo "$TOKEN" | cut -d. -f1 | base64 -d 2>/dev/null | jq . || echo "Failed to decode header"
          echo "Token payload:"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null)
          echo "$PAYLOAD" | jq . || echo "Failed to decode payload"
          
          # Extract claims for verification
          SUB=$(echo "$PAYLOAD" | jq -r .sub)
          AUD=$(echo "$PAYLOAD" | jq -r .aud)
          echo "sub claim: $SUB"
          echo "aud claim: $AUD"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098876901014:role/GitHubActionsDeployLambda
          aws-region: us-east-2

      - name: Package Lambda function
        run: |
          cd lambda/src
          zip -r ../function.zip .
          echo "PACKAGE_PATH=lambda/function.zip" >> $GITHUB_ENV

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name pavukanez-backend-openrouter \
            --zip-file fileb://${{ env.PACKAGE_PATH }}

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name pavukanez-backend-openrouter \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table