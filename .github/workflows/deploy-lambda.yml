name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda/src/**'
      - 'lambda/requirements*.txt'
      - 'lambda/Dockerfile*'
      - '!.github/**'
      - '!**/*.md'
      - '!**/test*.py'
      - '!**/__pycache__/**'

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required for checkout

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC token
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:0:20}..."
          # Request token with audience sts.amazonaws.com
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "Token (first 50 chars): ${TOKEN:0:50}"
          echo "Token payload:"
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || echo "Failed to decode"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098876901014:role/GitHubActionsDeployLambda
          aws-region: us-east-2

      - name: Package Lambda function
        run: |
          cd lambda/src
          zip -r ../function.zip .
          echo "PACKAGE_PATH=lambda/function.zip" >> $GITHUB_ENV

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name pavukanez-backend-openrouter \
            --zip-file fileb://${{ env.PACKAGE_PATH }}

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name pavukanez-backend-openrouter \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table