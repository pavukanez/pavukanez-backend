name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
      - '!.github/**'
      - '!**/*.md'
      - '!**/test*.py'
      - '!**/__pycache__/**'
      - '!lambda/deploy_package/**'
      - '!lambda/lambda_package/**'
      - '!lambda/*.zip'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required for checkout

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Lambda function with dependencies
        run: |
          set -e
          cd lambda
          
          # Clean previous builds
          rm -rf deploy_package
          rm -f function.zip
          
          # Create package directory
          mkdir -p deploy_package
          
          # Copy source code
          cp -r src deploy_package/
          cp lambda_function.py deploy_package/
          cp requirements.txt deploy_package/
          
          # Install dependencies
          cd deploy_package
          python3 -m pip install --target . -r requirements.txt --quiet --no-cache-dir
          
          # Remove unnecessary files to reduce size
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyo" -delete 2>/dev/null || true
          find . -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.so" -delete 2>/dev/null || true  # Remove compiled extensions (not portable)
          
          # Create deployment zip - Lambda expects handler at root, so zip contents of deploy_package
          cd deploy_package
          zip -r ../function.zip .
          cd ..
          echo "PACKAGE_PATH=lambda/function.zip" >> $GITHUB_ENV

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name pavukanez-backend-openrouter \
            --zip-file fileb://${{ env.PACKAGE_PATH }}

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name pavukanez-backend-openrouter \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table