name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda/src/**'
      - 'lambda/requirements*.txt'
      - 'lambda/Dockerfile*'
      - '!.github/**'
      - '!**/*.md'
      - '!**/test*.py'
      - '!**/__pycache__/**'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required for checkout

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Package Lambda function
        run: |
          cd lambda/src
          zip -r ../function.zip .
          echo "PACKAGE_PATH=lambda/function.zip" >> $GITHUB_ENV

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name pavukanez-backend-openrouter \
            --zip-file fileb://${{ env.PACKAGE_PATH }}

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name pavukanez-backend-openrouter \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table