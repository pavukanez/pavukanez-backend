name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
      - '!.github/**'
      - '!**/*.md'
      - '!**/test*.py'
      - '!**/__pycache__/**'
      - '!lambda/deploy_package/**'
      - '!lambda/lambda_package/**'
      - '!lambda/*.zip'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required for checkout

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Lambda function with dependencies
        run: |
          set -e
          cd lambda
          
          # Clean previous builds
          rm -rf deploy_package
          rm -f function.zip
          
          # Create package directory
          mkdir -p deploy_package
          
          # Copy source code
          cp -r src deploy_package/
          cp lambda_function.py deploy_package/
          cp requirements.txt deploy_package/
          
          # Install dependencies and clean up in a subshell to avoid directory issues
          (
            cd deploy_package
            python3 -m pip install --target . -r requirements.txt --quiet --no-cache-dir
            
            # Remove unnecessary files to reduce size
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find . -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
            find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
            find . -name "*.pyc" -delete 2>/dev/null || true
            find . -name "*.pyo" -delete 2>/dev/null || true
            find . -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
            find . -name "*.so" -delete 2>/dev/null || true  # Remove compiled extensions (not portable)
            
            # Create deployment zip - Lambda expects handler at root, so zip contents of deploy_package
            zip -r ../function.zip .
          )
          echo "PACKAGE_PATH=lambda/function.zip" >> $GITHUB_ENV

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name pavukanez-backend-openrouter \
            --zip-file fileb://${{ env.PACKAGE_PATH }}
          
          # Increase timeout for streaming (30s default too short for OpenRouter + tool calls)
          aws lambda update-function-configuration \
            --function-name pavukanez-backend-openrouter \
            --timeout 60

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name pavukanez-backend-openrouter \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table

      - name: Configure Function URL for response streaming
        run: |
          # Enable RESPONSE_STREAM mode for true streaming support
          # Note: Requires lambda:ListFunctionUrlConfigs and lambda:UpdateFunctionUrlConfig permissions
          set +e  # Don't fail deployment if permissions missing
          FUNCTION_URL=$(aws lambda list-function-url-configs \
            --function-name pavukanez-backend-openrouter \
            --query 'FunctionUrlConfigs[0].FunctionUrl' \
            --output text 2>/dev/null)
          LIST_EXIT_CODE=$?
          
          if [ $LIST_EXIT_CODE -eq 0 ] && [ "$FUNCTION_URL" != "None" ] && [ -n "$FUNCTION_URL" ]; then
            echo "Updating Function URL to RESPONSE_STREAM mode..."
            aws lambda update-function-url-config \
              --function-name pavukanez-backend-openrouter \
              --invoke-mode RESPONSE_STREAM 2>/dev/null
            UPDATE_EXIT_CODE=$?
            if [ $UPDATE_EXIT_CODE -eq 0 ]; then
              echo "Function URL streaming mode enabled: $FUNCTION_URL"
            else
              echo "Warning: Could not update Function URL (check IAM permissions for lambda:UpdateFunctionUrlConfig)"
            fi
          elif [ $LIST_EXIT_CODE -ne 0 ]; then
            echo "Warning: Could not list Function URLs (check IAM permissions for lambda:ListFunctionUrlConfigs)"
            echo "Run './lambda/enable_streaming.sh' manually after deployment"
          else
            echo "No Function URL found, skipping streaming config"
            echo "Run './lambda/enable_streaming.sh' manually to create one"
          fi
          set -e